<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Profile Setup — AlumniX</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="top-header-container"></div>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-wrapper">
      
      <div style="max-width: 680px; margin: 0 auto;">
        
        <div style="margin-bottom: 24px; text-align: center;">
          <span class="pill pill-green">🎓 Alumni Onboarding</span>
          <h1 style="font-size: 2rem; margin-top: 8px; margin-bottom: 4px;">Complete Your Alumni Profile</h1>
          <p class="text-sm text-muted">Help KIT students discover your mentorship and career expertise.</p>
        </div>

        <div class="card" style="padding: 32px;">
          <form id="alumni-profile-form">
            
            <div class="form-group">
              <label class="form-label" for="alum-fullname">Full Name</label>
              <input type="text" id="alum-fullname" class="form-control" required placeholder="e.g. Karthik Subramanian">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="alum-batch">Graduation Batch Year</label>
                <input type="number" id="alum-batch" class="form-control" placeholder="2020" min="2000" max="2025" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="alum-dept">Department</label>
                <select id="alum-dept" class="form-control" required>
                  <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                  <option value="Artificial Intelligence & Data Science">AI & Data Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Communication Engineering">Electronics & Communication</option>
                  <option value="Electrical & Electronics Engineering">Electrical & Electronics</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                </select>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="alum-company">Current Company</label>
                <input type="text" id="alum-company" class="form-control" placeholder="e.g. Zoho Corporation / Microsoft" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="alum-role">Job Role / Title</label>
                <input type="text" id="alum-role" class="form-control" placeholder="e.g. Senior Software Engineer" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="alum-industry">Industry Domain</label>
                <select id="alum-industry" class="form-control">
                  <option value="Software Development">Software Development</option>
                  <option value="SaaS">SaaS</option>
                  <option value="Artificial Intelligence">Artificial Intelligence</option>
                  <option value="Cloud Computing">Cloud Computing</option>
                  <option value="Automotive & IoT">Automotive & IoT</option>
                  <option value="Automation & Mechanical">Automation & Mechanical</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="alum-linkedin">LinkedIn Profile URL</label>
                <input type="url" id="alum-linkedin" class="form-control" placeholder="https://linkedin.com/in/yourprofile">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="alum-bio">Professional Bio & Mentorship Note</label>
              <textarea id="alum-bio" class="form-control" rows="4" placeholder="Briefly describe your experience and what advice or topics you can help KIT students with..."></textarea>
            </div>

            <div class="form-group" style="flex-direction: row; align-items: center; justify-content: space-between; background: var(--bg-page); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-default);">
              <div>
                <label class="form-label" style="margin-bottom: 2px;">Open to Student Mentorship</label>
                <p class="text-xs text-muted">Allow KIT students to discover your profile and request guidance.</p>
              </div>
              <input type="checkbox" id="alum-mentor-toggle" checked style="width: 20px; height: 20px; accent-color: var(--primary-green);">
            </div>

            <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
              <button type="submit" class="btn btn-primary btn-lg" id="btn-save-alumni-profile">
                Save & Continue to Dashboard →
              </button>
            </div>

          </form>
        </div>

      </div>

    </div>
  </main>

  <div id="bottom-nav-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/role-shell.js"></script>
  <script src="js/pages/register-alumni.js"></script>
</body>
</html>
