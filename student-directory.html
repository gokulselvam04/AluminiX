<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory — AlumniX</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="top-header-container"></div>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-wrapper">
      
      <!-- Page Title -->
      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 2rem; margin-bottom: 4px;">Student Directory</h1>
        <p class="text-sm text-muted">Browse and reach out to talented Karpagam Institute of Technology students.</p>
      </div>

      <!-- Search & Filters Bar -->
      <div class="card" style="margin-bottom: 28px; padding: 20px;">
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px;">
          
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="stud-search-input">Search Students</label>
            <input type="text" id="stud-search-input" class="form-control" placeholder="Search by name or interest area...">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="stud-dept-filter">Department</label>
            <select id="stud-dept-filter" class="form-control">
              <option value="All">All Departments</option>
              <option value="Computer Science & Engineering">Computer Science & Engineering</option>
              <option value="Artificial Intelligence & Data Science">AI & Data Science</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Communication Engineering">Electronics & Communication</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="stud-interest-filter">Interest Area</label>
            <select id="stud-interest-filter" class="form-control">
              <option value="All">All Interests</option>
              <option value="Software Development">Software Development</option>
              <option value="Data Science">Data Science</option>
              <option value="Cloud Computing">Cloud Computing</option>
              <option value="Artificial Intelligence">Artificial Intelligence</option>
              <option value="Mobile Development">Mobile Development</option>
            </select>
          </div>

        </div>
      </div>

      <!-- Count Header -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
        <h3 style="font-size: 1.1rem;" id="student-directory-count-label">Showing Students (0)</h3>
        <span class="pill pill-green">KIT Student Network</span>
      </div>

      <!-- Student Cards Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;" id="student-cards-grid">
        <div class="card animate-pulse" style="padding: 24px;">Loading directory...</div>
      </div>

    </div>
  </main>

  <!-- Connection Request Modal -->
  <div class="modal-overlay" id="stud-connection-modal">
    <div class="modal-card">
      <button class="modal-close-btn" id="stud-modal-close-x">✕</button>
      <div style="margin-bottom: 20px;">
        <span class="pill pill-green">Connection Request</span>
        <h2 style="font-size: 1.4rem; margin-top: 6px;" id="stud-modal-student-name">Reach Out to Student</h2>
        <p class="text-sm text-muted" id="stud-modal-student-subtitle">KIT Student</p>
      </div>

      <form id="stud-connection-request-form">
        <input type="hidden" id="stud-modal-student-id">
        <div class="form-group">
          <label class="form-label" for="stud-request-message">Connection Message</label>
          <textarea id="stud-request-message" class="form-control" rows="4" placeholder="Introduce yourself, share your mentoring expertise, and what you're interested in discussing..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
          <button type="button" class="btn btn-secondary" id="stud-modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="stud-modal-submit-btn">Send Request →</button>
        </div>
      </form>
    </div>
  </div>

  <div id="bottom-nav-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/role-shell.js"></script>
  <script src="js/pages/student-directory.js"></script>
</body>
</html>
