<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Chat — AlumniX</title>
  <meta name="description" content="Chat with AlumniX AI Career Assistant">
  <link rel="stylesheet" href="css/chat-styles.css">
</head>
<body>
  <div class="chat-container">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="logo-wrapper">
          <img src="images/logo.png" alt="AlumniX Logo" class="logo-img">
          <span class="logo-text">AlumniX AI</span>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- New Chat Button -->
      <button class="new-chat-btn" id="newChatBtn" aria-label="Start a new chat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 5V15M5 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>New Chat</span>
      </button>

      <!-- Recent Conversations List -->
      <div class="recent-section">
        <h3 class="recent-title">Recent</h3>
        <div id="recentList" class="recent-list"></div>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark/light theme">
          <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M10 1V3M10 17V19M19 10H17M3 10H1M16.5 3.5L15.08 4.92M4.92 15.08L3.5 16.5M16.5 16.5L15.08 15.08M4.92 4.92L3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </button>
        <div class="user-profile-row">
          <div class="user-avatar">👤</div>
          <span class="user-name">Profile</span>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Chat Area -->
    <main class="chat-main">
      <!-- Mobile Header -->
      <header class="mobile-header">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle sidebar menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <h1 class="mobile-title">AlumniX AI</h1>
        <button class="mobile-new-chat-btn" id="mobileNewChatBtn" aria-label="Start a new chat">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 5V15M5 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <!-- Welcome Screen -->
      <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-content">
          <div class="welcome-icon">💡</div>
          <h2 class="welcome-heading">How can I help you today?</h2>
          <p class="welcome-subtitle">Get career advice, explore mentorship opportunities, and more.</p>
          
          <div class="suggestion-grid">
            <button class="suggestion-card" data-suggestion="Help me find a mentor in my field">
              <div class="suggestion-icon">🎯</div>
              <div class="suggestion-text">Find a mentor</div>
            </button>
            <button class="suggestion-card" data-suggestion="What skills should I develop for a software engineering role?">
              <div class="suggestion-icon">📚</div>
              <div class="suggestion-text">Build my skills</div>
            </button>
            <button class="suggestion-card" data-suggestion="Can you suggest internship opportunities?">
              <div class="suggestion-icon">💼</div>
              <div class="suggestion-text">Find internships</div>
            </button>
            <button class="suggestion-card" data-suggestion="Create a personalized career roadmap for me">
              <div class="suggestion-icon">🗺️</div>
              <div class="suggestion-text">My roadmap</div>
            </button>
          </div>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="messagesArea" class="messages-area" style="display: none;">
        <!-- Messages will be inserted here dynamically -->
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <div class="input-container">
          <button class="attach-btn" aria-label="Attach file" title="Attach file">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 2V18M2 10H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          
          <textarea 
            id="messageInput" 
            class="message-textarea" 
            placeholder="Message AlumniX AI..." 
            aria-label="Type your message"
            rows="1"
          ></textarea>
          
          <button class="mic-btn" aria-label="Voice input" title="Voice input">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 3C8.34315 3 7 4.34315 7 6V10C7 11.6569 8.34315 13 10 13C11.6569 13 13 11.6569 13 10V6C13 4.34315 11.6569 3 10 3Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 10C5 10 5 12 10 12C15 12 15 10 15 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M10 12V17M7 17H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          
          <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 10L18 2L10 18L7 12L2 10Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <p class="input-disclaimer">AI can make mistakes. Consider checking important information.</p>
      </div>
    </main>
  </div>

  <script src="js/chat-script.js"></script>
</body>
</html>
