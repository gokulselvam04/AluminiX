<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AlumniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .signup-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .signup-body {
            padding: 40px 30px;
        }

        .role-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .role-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .google-btn {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            color: #3c4043;
            border: 1.5px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
            margin-bottom: 18px;
            font-family: inherit;
        }

        .google-btn:hover:not(:disabled) {
            background: #f8f9fa;
            border-color: #c2c7d0;
            box-shadow: 0 2px 8px rgba(60, 64, 67, 0.15);
            transform: translateY(-1px);
        }

        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .google-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0;
            color: #70757a;
            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .auth-divider span {
            padding: 0 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .google-connected-card {
            background: #f0f7ff;
            border: 1.5px solid #cce4ff;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        .google-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .google-user-info {
            flex: 1;
            min-width: 0;
        }

        .google-user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a73e8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .google-user-email {
            font-size: 12px;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .google-connected-tag {
            display: inline-block;
            font-size: 11px;
            color: #137333;
            font-weight: 600;
            margin-top: 2px;
        }

        .google-disconnect-btn {
            background: none;
            border: none;
            color: #70757a;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .google-disconnect-btn:hover {
            color: #d93025;
            background: rgba(217, 48, 37, 0.08);
        }

        .google-auth-notice {
            background: #e6f4ea;
            border: 1px solid #ceead6;
            color: #137333;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
            max-height: 200px;
            overflow-y: auto;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input[readonly] {
            background-color: #f8f9fa;
            cursor: not-allowed;
            color: #555;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-header">
            <h1>AlumniX</h1>
            <p>Join our community of innovators</p>
        </div>

        <div class="signup-body">
            <div id="alert" class="alert"></div>

            <div class="role-tabs">
                <button class="role-tab active" data-role="student" type="button">Student</button>
                <button class="role-tab" data-role="alumni" type="button">Alumni</button>
            </div>

            <!-- Google Sign-In Button -->
            <button type="button" class="google-btn" id="googleBtn">
                <svg class="google-icon" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.79l7.97-6.2z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span id="googleBtnLabel">Continue with Google</span>
            </button>

            <!-- Google Account Connected Card -->
            <div id="googleConnectedCard" class="google-connected-card" style="display: none;">
                <img id="googleUserAvatar" src="" class="google-avatar" alt="Google Profile">
                <div class="google-user-info">
                    <div id="googleUserName" class="google-user-name"></div>
                    <div id="googleUserEmail" class="google-user-email"></div>
                    <div class="google-connected-tag">âœ“ Google Account Connected</div>
                </div>
                <button type="button" id="googleDisconnectBtn" class="google-disconnect-btn" title="Use a different account">âœ•</button>
            </div>

            <div class="auth-divider" id="authDivider">
                <span>or register with details</span>
            </div>

            <form id="signupForm" novalidate>
                <!-- Student Form -->
                <div id="studentSection" class="form-section active">
                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" name="studentName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Email Address</label>
                        <input type="email" id="studentEmail" name="studentEmail" placeholder="john@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="studentDept">Department</label>
                        <select id="studentDept" name="studentDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="studentBatch">Batch Year</label>
                        <input type="number" id="studentBatch" name="studentBatch" placeholder="2024" min="2020" max="2030" required>
                    </div>

                    <div id="studentPassContainer">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="studentPass">Password</label>
                                <input type="password" id="studentPass" name="studentPass" placeholder="Min 8 characters" autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label for="studentPassConfirm">Confirm Password</label>
                                <input type="password" id="studentPassConfirm" name="studentPassConfirm" placeholder="Confirm password" autocomplete="new-password">
                            </div>
                        </div>
                    </div>

                    <div id="studentGoogleNotice" class="google-auth-notice" style="display: none;">
                        <span>ðŸ”’</span> Authenticated securely via Google. Password not required.
                    </div>
                </div>

                <!-- Alumni Form -->
                <div id="alumniSection" class="form-section">
                    <div class="form-group">
                        <label for="alumniName">Full Name</label>
                        <input type="text" id="alumniName" name="alumniName" placeholder="Jane Smith" disabled required>
                    </div>

                    <div class="form-group">
                        <label for="alumniEmail">Email Address</label>
                        <input type="email" id="alumniEmail" name="alumniEmail" placeholder="jane@company.com" disabled required>
                    </div>

                    <div class="form-group">
                        <label for="alumniDept">Department (During Study)</label>
                        <select id="alumniDept" name="alumniDept" disabled required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="alumniYear">Graduation Year</label>
                            <input type="number" id="alumniYear" name="alumniYear" placeholder="2020" min="1980" max="2026" disabled required>
                        </div>
                        <div class="form-group">
                            <label for="alumniCompany">Company</label>
                            <input type="text" id="alumniCompany" name="alumniCompany" placeholder="Tech Corp" disabled required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="alumniTitle">Job Title</label>
                        <input type="text" id="alumniTitle" name="alumniTitle" placeholder="Senior Engineer" disabled required>
                    </div>

                    <div id="alumniPassContainer">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="alumniPass">Password</label>
                                <input type="password" id="alumniPass" name="alumniPass" placeholder="Min 8 characters" disabled autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label for="alumniPassConfirm">Confirm Password</label>
                                <input type="password" id="alumniPassConfirm" name="alumniPassConfirm" placeholder="Confirm password" disabled autocomplete="new-password">
                            </div>
                        </div>
                    </div>

                    <div id="alumniGoogleNotice" class="google-auth-notice" style="display: none;">
                        <span>ðŸ”’</span> Authenticated securely via Google. Password not required.
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Create Account
                </button>
            </form>

            <div class="footer-link">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </div>

    <!-- Official UMD build for Supabase JS v2 & Google Identity Services -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/post-auth-modal.js"></script>

    <script>
        console.log('[Signup] Page loaded');
        
        let activeRole = 'student';
        let googleUserData = null;

        // Show alert with detailed error or success info
        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('alert');
            if (!alert) return;
            alert.textContent = msg;
            alert.className = `alert show ${type}`;
            if (type === 'error') {
                console.error(`[Signup Alert] ${type}:`, msg);
            } else {
                console.log(`[Signup Alert] ${type}:`, msg);
            }
            alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function hideAlert() {
            const alert = document.getElementById('alert');
            if (alert) {
                alert.className = 'alert';
                alert.textContent = '';
            }
        }

        // Email validation helper
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // Toggle role and active fields
        function switchRole(role) {
            activeRole = role;
            console.log('[Signup] Switching role to:', activeRole);
            hideAlert();

            document.querySelectorAll('.role-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.role === activeRole);
            });

            const studentSec = document.getElementById('studentSection');
            const alumniSec = document.getElementById('alumniSection');

            if (activeRole === 'student') {
                studentSec.classList.add('active');
                alumniSec.classList.remove('active');
                studentSec.querySelectorAll('input, select').forEach(el => el.removeAttribute('disabled'));
                alumniSec.querySelectorAll('input, select').forEach(el => el.setAttribute('disabled', 'true'));
            } else {
                studentSec.classList.remove('active');
                alumniSec.classList.add('active');
                alumniSec.querySelectorAll('input, select').forEach(el => el.removeAttribute('disabled'));
                studentSec.querySelectorAll('input, select').forEach(el => el.setAttribute('disabled', 'true'));
            }

            if (googleUserData) {
                applyGoogleUserToForm(googleUserData);
            }
        }

        // Set Google User details into form
        function applyGoogleUserToForm(gUser) {
            googleUserData = gUser;

            const card = document.getElementById('googleConnectedCard');
            const avatar = document.getElementById('googleUserAvatar');
            const nameEl = document.getElementById('googleUserName');
            const emailEl = document.getElementById('googleUserEmail');
            const gBtn = document.getElementById('googleBtn');
            const divider = document.getElementById('authDivider');

            if (card) {
                avatar.src = gUser.picture || `https://ui-avatars.com/api/?name=${encodeURIComponent(gUser.name)}&background=667eea&color=fff`;
                nameEl.textContent = gUser.name;
                emailEl.textContent = gUser.email;
                card.style.display = 'flex';
            }
            if (gBtn) gBtn.style.display = 'none';
            if (divider) divider.style.display = 'none';

            // Populate form fields
            const studentName = document.getElementById('studentName');
            const studentEmail = document.getElementById('studentEmail');
            const alumniName = document.getElementById('alumniName');
            const alumniEmail = document.getElementById('alumniEmail');

            if (studentName) studentName.value = gUser.name || '';
            if (studentEmail) {
                studentEmail.value = gUser.email || '';
                studentEmail.readOnly = true;
            }

            if (alumniName) alumniName.value = gUser.name || '';
            if (alumniEmail) {
                alumniEmail.value = gUser.email || '';
                alumniEmail.readOnly = true;
            }

            // Hide password sections & show Google notice
            const studentPass = document.getElementById('studentPassContainer');
            const studentNotice = document.getElementById('studentGoogleNotice');
            const alumniPass = document.getElementById('alumniPassContainer');
            const alumniNotice = document.getElementById('alumniGoogleNotice');

            if (studentPass) studentPass.style.display = 'none';
            if (studentNotice) studentNotice.style.display = 'flex';
            if (alumniPass) alumniPass.style.display = 'none';
            if (alumniNotice) alumniNotice.style.display = 'flex';

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.textContent = 'Complete Registration â†’';

            showAlert(`Google account connected (${gUser.email})! Please complete the remaining ${activeRole === 'student' ? 'Student' : 'Alumni'} details below.`, 'success');
        }

        // Disconnect Google Account
        function disconnectGoogle() {
            googleUserData = null;
            const card = document.getElementById('googleConnectedCard');
            const gBtn = document.getElementById('googleBtn');
            const divider = document.getElementById('authDivider');

            if (card) card.style.display = 'none';
            if (gBtn) gBtn.style.display = 'flex';
            if (divider) divider.style.display = 'flex';

            const studentEmail = document.getElementById('studentEmail');
            const alumniEmail = document.getElementById('alumniEmail');
            if (studentEmail) studentEmail.readOnly = false;
            if (alumniEmail) alumniEmail.readOnly = false;

            const studentPass = document.getElementById('studentPassContainer');
            const studentNotice = document.getElementById('studentGoogleNotice');
            const alumniPass = document.getElementById('alumniPassContainer');
            const alumniNotice = document.getElementById('alumniGoogleNotice');

            if (studentPass) studentPass.style.display = 'block';
            if (studentNotice) studentNotice.style.display = 'none';
            if (alumniPass) alumniPass.style.display = 'block';
            if (alumniNotice) alumniNotice.style.display = 'none';

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.textContent = 'Create Account';

            hideAlert();
        }

        // Process verified Google user: check if existing user, or load into form
        async function processGoogleUser(gUser) {
            const client = await getSupabaseClient();
            if (!client) return;

            // Check if user already exists in public.users
            try {
                const { data: existingUser, error: checkErr } = await client
                    .from('users')
                    .select('*')
                    .eq('email', gUser.email)
                    .maybeSingle();

                if (existingUser) {
                    console.log('[Google Auth] Existing user found in database:', existingUser);
                    showAlert(`Welcome back, ${existingUser.full_name}! Logging in...`, 'success');

                    const sessionObj = {
                        id: existingUser.id,
                        email: existingUser.email,
                        role: existingUser.role,
                        full_name: existingUser.full_name,
                        department: existingUser.department,
                        institution: existingUser.institution || 'Karpagam Institute of Technology'
                    };

                    localStorage.setItem('alumnix_user_session', JSON.stringify(sessionObj));
                    localStorage.setItem('alumnix_user', JSON.stringify(sessionObj));

                    // Check if department is missing - show modal
                    if (!existingUser.department || existingUser.department === 'Computer Science & Engineering') {
                        window.postAuthModal.show(sessionObj, existingUser.role);
                        return;
                    }

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    return;
                }
            } catch (e) {
                console.warn('[Google Auth] User lookup notice:', e);
            }

            // User is new: apply details to form
            applyGoogleUserToForm(gUser);
        }

        // Initiate Google Sign-In
        async function initiateGoogleSignIn() {
            hideAlert();
            console.log('[Google Auth] Initiating Google Sign-In');
            const gBtn = document.getElementById('googleBtn');
            const btnLabel = document.getElementById('googleBtnLabel');
            gBtn.disabled = true;
            btnLabel.textContent = 'Connecting Google...';

            try {
                const client = await getSupabaseClient();
                if (!client || !client.auth) {
                    throw new Error('Supabase client not initialized. Please reload the page.');
                }

                // 1. Primary: Use Supabase native Google OAuth redirect
                const { data, error } = await client.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}${window.location.pathname}?role=${activeRole}`
                    }
                });

                if (error) {
                    console.warn('[Google Auth] Supabase OAuth redirect notice:', error);
                    // Fallback to GIS Token Client
                    const clientId = window.ALUMNIX_CONFIG?.GOOGLE_CLIENT_ID;
                    if (window.google && window.google.accounts && window.google.accounts.oauth2 && clientId) {
                        const tokenClient = window.google.accounts.oauth2.initTokenClient({
                            client_id: clientId,
                            scope: 'email profile openid',
                            callback: async (tokenResponse) => {
                                gBtn.disabled = false;
                                btnLabel.textContent = 'Continue with Google';
                                if (tokenResponse && tokenResponse.access_token) {
                                    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                        headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                                    });
                                    const userInfo = await res.json();
                                    if (userInfo && userInfo.email) {
                                        await processGoogleUser({
                                            id: userInfo.sub,
                                            email: userInfo.email,
                                            name: userInfo.name || userInfo.email.split('@')[0],
                                            picture: userInfo.picture || ''
                                        });
                                    }
                                }
                            }
                        });
                        tokenClient.requestAccessToken({ prompt: 'select_account' });
                        return;
                    }
                    throw error;
                }
            } catch (err) {
                console.error('[Google Auth Error]', err);
                showAlert(err.message || 'Google sign in failed. Please fill the form to register.', 'error');
                gBtn.disabled = false;
                btnLabel.textContent = 'Continue with Google';

        // Check for URL parameters or OAuth redirect callback on page load

            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');
            if (roleParam && (roleParam === 'student' || roleParam === 'alumni')) {
                switchRole(roleParam);
            }

            // Check if Supabase session already exists from OAuth redirect
            const client = await getSupabaseClient();
            if (client && client.auth) {
                const { data: { session } } = await client.auth.getSession();
                if (session && session.user) {
                    const u = session.user;
                    console.log('[Signup] Active Supabase OAuth session found:', u);
                    const gUser = {
                        id: u.id,
                        email: u.email,
                        name: u.user_metadata?.full_name || u.email.split('@')[0],
                        picture: u.user_metadata?.avatar_url || ''
                    };

                }
            }
        }

                tab.addEventListener('click', (e) => {
                    e.preventDefault();

                });
            });

            // Google Sign-In Button listener
            document.getElementById('googleBtn')?.addEventListener('click', initiateGoogleSignIn);
            document.getElementById('googleDisconnectBtn')?.addEventListener('click', disconnectGoogle);

            // Initial role state
            switchRole('student');

        // Ensure Supabase client is ready
        async function getSupabaseClient(maxAttempts = 15) {
            for (let i = 0; i < maxAttempts; i++) {
                if (window.supabaseClient && window.supabaseClient.auth) {
                    return window.supabaseClient;
                }
                if (typeof window.initializeSupabase === 'function') {
                    window.initializeSupabase();
                }
                await new Promise(res => setTimeout(res, 100));
            }
            return window.supabaseClient;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            hideAlert();
            console.log('[Signup] Form submitted - role:', activeRole, 'Google connected:', !!googleUserData);
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Saving to database...';

            try {
                const client = await getSupabaseClient();
                if (!client || !client.auth) {
                    throw new Error('Supabase client failed to initialize. Please check your internet connection or reload.');
                }

                if (activeRole === 'student') {
                    await handleStudentSignup(client);
                } else {
                    await handleAlumniSignup(client);
                }
            } catch (error) {
                const errorMsg = error.message || error.toString() || 'An unexpected error occurred during signup.';
                console.error('[SIGNUP_ERROR]', error);
                showAlert(errorMsg, 'error');

        async function handleStudentSignup(client) {

            const passConfirm = document.getElementById('studentPassConfirm')?.value;

            if (!dept || dept === '') throw new Error('Department is REQUIRED - please select your department');
            if (!batch) throw new Error('Batch year is required');
            const batchNum = parseInt(batch, 10);
            if (isNaN(batchNum) || batchNum < 2000 || batchNum > 2035) {
                throw new Error('Please enter a valid batch year (e.g. 2024)');
            }

            let userId = null;

            if (!googleUserData) {
                // Email & Password flow
                if (!pass) throw new Error('Password is required');
                if (pass.length < 8) throw new Error('Password must be at least 8 characters long');
                if (pass !== passConfirm) throw new Error('Passwords do not match');

                console.log('[Student Signup] Calling Supabase auth.signUp...');
                const { data, error } = await client.auth.signUp({
                    email,
                    password: pass,
                    options: {
                        data: {
                            full_name: name,
                            role: 'student',
                            department: dept,
                            batch: batch
                        }
                    }
                });

                if (error) {
                    console.error('[Student Signup] Supabase Auth Error:', error);
                    if (error.message.toLowerCase().includes('already registered')) {
                        throw new Error('An account with this email already exists. Please log in.');
                    }
                    throw new Error(error.message);
                }

                if (!data || !data.user) {
                    throw new Error('Account creation failed: no user data returned.');
                }
                userId = data.user.id;
            } else {
                // Google Authenticated flow
                const { data: { session } } = await client.auth.getSession();
                if (session && session.user) {
                    userId = session.user.id;
                } else {
                    const tempPass = 'GAuth_' + btoa(email).replace(/=/g, '') + '#2026';

                        email: email,
                        password: tempPass,
                        options: {
                            data: {
                                full_name: name,
                                role: 'student',
                                department: dept
                            }
                        }
                    });

                    if (authData && authData.user) {
                        userId = authData.user.id;
                    } else if (authErr && authErr.message.toLowerCase().includes('already registered')) {
                        const { data: loginData } = await client.auth.signInWithPassword({
                            email: email,
                            password: tempPass
                        });
                        if (loginData && loginData.user) {
                            userId = loginData.user.id;
                        }
                    }
                    
                    if (!userId) {
                        userId = (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'usr_' + Date.now());
                    }
                }
            }

            console.log('[Student Signup] âœ… Auth user resolved! ID:', userId);

            // Synchronize with public.users table in Supabase
