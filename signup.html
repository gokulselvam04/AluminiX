<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AlumniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .signup-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .signup-body {
            padding: 40px 30px;
        }

        .role-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .role-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-header">
            <h1>AlumniX</h1>
            <p>Join our community of innovators</p>
        </div>

        <div class="signup-body">
            <div id="alert" class="alert"></div>

            <div class="role-tabs">
                <button class="role-tab active" data-role="student">Student</button>
                <button class="role-tab" data-role="alumni">Alumni</button>
            </div>

            <form id="signupForm">
                <!-- Student Form -->
                <div id="studentSection" class="form-section active">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="studentName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="studentEmail" placeholder="john@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <select id="studentDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Batch Year</label>
                            <input type="number" id="studentBatch" placeholder="2024" min="2020" max="2030" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="studentPass" placeholder="Min 8 characters" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="studentPassConfirm" placeholder="Confirm password" required>
                    </div>
                </div>

                <!-- Alumni Form -->
                <div id="alumniSection" class="form-section">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="alumniName" placeholder="Jane Smith" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="alumniEmail" placeholder="jane@company.com" required>
                    </div>

                    <div class="form-group">
                        <label>Department (During Study)</label>
                        <select id="alumniDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Graduation Year</label>
                            <input type="number" id="alumniYear" placeholder="2020" min="1990" max="2024" required>
                        </div>
                        <div class="form-group">
                            <label>Company</label>
                            <input type="text" id="alumniCompany" placeholder="Tech Corp" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" id="alumniTitle" placeholder="Senior Engineer" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="alumniPass" placeholder="Min 8 characters" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" id="alumniPassConfirm" placeholder="Confirm password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Create Account
                </button>
            </form>

            <div class="footer-link">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/module.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>

    <script>
        // Wait for Supabase to be ready
        async function waitForSupabase(maxAttempts = 10) {
            for (let i = 0; i < maxAttempts; i++) {
                if (window.supabaseClient && window.supabaseClient.auth) {
                    console.log('[Signup] ✅ Supabase client ready');
                    return true;
                }
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            console.error('[Signup] ❌ Supabase client not ready after waiting');
            return false;
        }

        let activeRole = 'student';

        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
                
                tab.classList.add('active');
                activeRole = tab.dataset.role;
                
                if (activeRole === 'student') {
                    document.getElementById('studentSection').classList.add('active');
                } else {
                    document.getElementById('alumniSection').classList.add('active');
                }
            });
        });

        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = `alert show ${type}`;
            if (type === 'success') {
                setTimeout(() => alert.classList.remove('show'), 3000);
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                // Ensure Supabase is ready
                const ready = await waitForSupabase();
                if (!ready) {
                    throw new Error('Supabase not initialized. Please refresh the page.');
                }

                if (activeRole === 'student') {
                    await signupStudent();
                } else {
                    await signupAlumni();
                }
            } catch (err) {
                console.error('Signup error:', err);
                showAlert(err.message || 'Signup failed', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        });

        async function signupStudent() {
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();
            const dept = document.getElementById('studentDept').value;
            const batch = document.getElementById('studentBatch').value;
            const pass = document.getElementById('studentPass').value;
            const passConfirm = document.getElementById('studentPassConfirm').value;

            console.log('[Signup] Starting student signup:', { email, name });

            if (!name || !email || !dept || !batch || !pass) {
                throw new Error('Please fill all fields');
            }

            if (pass !== passConfirm) {
                throw new Error('Passwords do not match');
            }

            if (pass.length < 8) {
                throw new Error('Password must be at least 8 characters');
            }

            console.log('[Signup] Validation passed');

            // 1. Sign up with Supabase Auth
            const { data, error } = await window.supabaseClient.auth.signUp({
                email,
                password: pass,
                options: { 
                    data: { 
                        full_name: name, 
                        role: 'student',
                        department: dept,
                        batch: batch
                    } 
                }
            });

            if (error) {
                console.error('[Signup] Auth error:', error);
                throw new Error(error.message);
            }

            if (!data.user) {
                throw new Error('Signup failed - no user returned');
            }

            const userId = data.user.id;
            console.log('[Signup] User created in auth:', userId);

            // 2. Call backend to create user record
            try {
                const apiUrl = window.location.origin.includes('5000') 
                    ? 'http://127.0.0.1:5000/api/auth-complete-signup' 
                    : '/api/auth-complete-signup';

                console.log('[Signup] Calling backend:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        email,
                        full_name: name,
                        role: 'student',
                        department: dept
                    })
                });

                const responseData = await response.json();
                console.log('[Signup] Backend response:', responseData);

                if (!response.ok) {
                    console.warn('[Signup] Backend warning:', responseData.error);
                }
            } catch (err) {
                console.warn('[Signup] Backend sync warning (continuing anyway):', err);
            }

            localStorage.setItem('alumnix_user', JSON.stringify({ id: userId, email, name, role: 'student' }));
            console.log('[Signup] ✅ User saved to localStorage');

            showAlert('Account created! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'profile.html'; }, 1500);
        }

        async function signupAlumni() {
            const name = document.getElementById('alumniName').value.trim();
            const email = document.getElementById('alumniEmail').value.trim();
            const dept = document.getElementById('alumniDept').value;
            const year = document.getElementById('alumniYear').value;
            const company = document.getElementById('alumniCompany').value.trim();
            const title = document.getElementById('alumniTitle').value.trim();
            const pass = document.getElementById('alumniPass').value;
            const passConfirm = document.getElementById('alumniPassConfirm').value;

            console.log('[Signup] Starting alumni signup:', { email, name });

            if (!name || !email || !dept || !year || !company || !title || !pass) {
                throw new Error('Please fill all fields');
            }

            if (pass !== passConfirm) {
                throw new Error('Passwords do not match');
            }

            if (pass.length < 8) {
                throw new Error('Password must be at least 8 characters');
            }

            console.log('[Signup] Validation passed');

            // 1. Sign up with Supabase Auth
            const { data, error } = await window.supabaseClient.auth.signUp({
                email,
                password: pass,
                options: { 
                    data: { 
                        full_name: name, 
                        role: 'alumni',
                        department: dept,
                        grad_year: year,
                        company: company,
                        job_role: title
                    } 
                }
            });

            if (error) {
                console.error('[Signup] Auth error:', error);
                throw new Error(error.message);
            }

            if (!data.user) {
                throw new Error('Signup failed - no user returned');
            }

            const userId = data.user.id;
            console.log('[Signup] User created in auth:', userId);

            // 2. Call backend to create user record
            try {
                const apiUrl = window.location.origin.includes('5000') 
                    ? 'http://127.0.0.1:5000/api/auth-complete-signup' 
                    : '/api/auth-complete-signup';

                console.log('[Signup] Calling backend:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        email,
                        full_name: name,
                        role: 'alumni',
                        department: dept
                    })
                });

                const responseData = await response.json();
                console.log('[Signup] Backend response:', responseData);

                if (!response.ok) {
                    console.warn('[Signup] Backend warning:', responseData.error);
                }
            } catch (err) {
                console.warn('[Signup] Backend sync warning (continuing anyway):', err);
            }

            localStorage.setItem('alumnix_user', JSON.stringify({ id: userId, email, name, role: 'alumni' }));
            console.log('[Signup] ✅ User saved to localStorage');

            showAlert('Account created! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'profile.html'; }, 1500);
        }
    </script>
</body>
</html>
