<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AlumniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .signup-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .signup-body {
            padding: 40px 30px;
        }

        .role-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .role-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
            max-height: 200px;
            overflow-y: auto;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-header">
            <h1>AlumniX</h1>
            <p>Join our community of innovators</p>
        </div>

        <div class="signup-body">
            <div id="alert" class="alert"></div>

            <div class="role-tabs">
                <button class="role-tab active" data-role="student" type="button">Student</button>
                <button class="role-tab" data-role="alumni" type="button">Alumni</button>
            </div>

            <form id="signupForm">
                <!-- Student Form -->
                <div id="studentSection" class="form-section active">
                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" name="studentName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Email Address</label>
                        <input type="email" id="studentEmail" name="studentEmail" placeholder="john@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="studentDept">Department</label>
                        <select id="studentDept" name="studentDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentBatch">Batch Year</label>
                            <input type="number" id="studentBatch" name="studentBatch" placeholder="2024" min="2020" max="2030" required>
                        </div>
                        <div class="form-group">
                            <label for="studentPass">Password</label>
                            <input type="password" id="studentPass" name="studentPass" placeholder="Min 8 characters" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="studentPassConfirm">Confirm Password</label>
                        <input type="password" id="studentPassConfirm" name="studentPassConfirm" placeholder="Confirm password" required>
                    </div>
                </div>

                <!-- Alumni Form -->
                <div id="alumniSection" class="form-section">
                    <div class="form-group">
                        <label for="alumniName">Full Name</label>
                        <input type="text" id="alumniName" name="alumniName" placeholder="Jane Smith" required>
                    </div>

                    <div class="form-group">
                        <label for="alumniEmail">Email Address</label>
                        <input type="email" id="alumniEmail" name="alumniEmail" placeholder="jane@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="alumniDept">Department (During Study)</label>
                        <select id="alumniDept" name="alumniDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="alumniYear">Graduation Year</label>
                            <input type="number" id="alumniYear" name="alumniYear" placeholder="2020" min="1990" max="2024" required>
                        </div>
                        <div class="form-group">
                            <label for="alumniCompany">Company</label>
                            <input type="text" id="alumniCompany" name="alumniCompany" placeholder="Tech Corp" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="alumniTitle">Job Title</label>
                        <input type="text" id="alumniTitle" name="alumniTitle" placeholder="Senior Engineer" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="alumniPass">Password</label>
                            <input type="password" id="alumniPass" name="alumniPass" placeholder="Min 8 characters" required>
                        </div>
                        <div class="form-group">
                            <label for="alumniPassConfirm">Confirm Password</label>
                            <input type="password" id="alumniPassConfirm" name="alumniPassConfirm" placeholder="Confirm password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Create Account
                </button>
            </form>

            <div class="footer-link">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/module.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>

    <script>
        console.log('[Signup] Page loaded');
        
        let activeRole = 'student';

        // Show alert with detailed error info
        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = `alert show ${type}`;
            console.error(`[ALERT] ${type}: ${msg}`);
            window.scrollTo(0, 0);
        }

        // Initialize form
        function setupForm() {
            console.log('[Signup] Setting up form');
            
            // Role tab listeners
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('[Signup] Switching role to:', tab.dataset.role);
                    
                    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
                    
                    tab.classList.add('active');
                    activeRole = tab.dataset.role;
                    
                    if (activeRole === 'student') {
                        document.getElementById('studentSection').classList.add('active');
                    } else {
                        document.getElementById('alumniSection').classList.add('active');
                    }
                });
            });

            // Form submit listener
            const form = document.getElementById('signupForm');
            form.addEventListener('submit', handleSubmit);
            console.log('[Signup] Form listeners attached');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            console.log('[Signup] Form submitted - role:', activeRole);
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                // Check Supabase
                if (!window.supabaseClient) {
                    throw new Error('Supabase not initialized - try refreshing the page');
                }

                if (!window.supabaseClient.auth) {
                    throw new Error('Supabase auth not available');
                }

                if (activeRole === 'student') {
                    await handleStudentSignup();
                } else {
                    await handleAlumniSignup();
                }
            } catch (error) {
                const errorMsg = error.message || error.toString();
                console.error('[SIGNUP_ERROR]', error);
                showAlert(`Error: ${errorMsg}`);
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }

        async function handleStudentSignup() {
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();
            const dept = document.getElementById('studentDept').value;
            const batch = document.getElementById('studentBatch').value;
            const pass = document.getElementById('studentPass').value;
            const passConfirm = document.getElementById('studentPassConfirm').value;

            console.log('[Student Signup] Values:', { name, email, dept, batch, passLength: pass.length });

            // Validation
            if (!name) throw new Error('Name is required');
            if (!email) throw new Error('Email is required');
            if (!dept) throw new Error('Department is required');
            if (!batch) throw new Error('Batch year is required');
            if (!pass) throw new Error('Password is required');
            if (pass.length < 8) throw new Error('Password must be at least 8 characters');
            if (pass !== passConfirm) throw new Error('Passwords do not match');

            console.log('[Student Signup] Validation passed');

            // Call Supabase
            console.log('[Student Signup] Calling Supabase.auth.signUp...');
            const { data, error } = await window.supabaseClient.auth.signUp({
                email,
                password: pass,
                options: {
                    data: {
                        full_name: name,
                        role: 'student',
                        department: dept,
                        batch: batch
                    }
                }
            });

            if (error) {
                console.error('[Student Signup] Supabase Error:', error);
                throw new Error(`Supabase error: ${error.message}`);
            }

            if (!data || !data.user) {
                console.error('[Student Signup] No user in response:', data);
                throw new Error('Account creation failed - no user returned');
            }

            console.log('[Student Signup] ✅ Success! User ID:', data.user.id);

            // Save and redirect
            localStorage.setItem('alumnix_user', JSON.stringify({
                id: data.user.id,
                email: email,
                name: name,
                role: 'student'
            }));

            showAlert('Account created successfully! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1500);
        }

        async function handleAlumniSignup() {
            const name = document.getElementById('alumniName').value.trim();
            const email = document.getElementById('alumniEmail').value.trim();
            const dept = document.getElementById('alumniDept').value;
            const year = document.getElementById('alumniYear').value;
            const company = document.getElementById('alumniCompany').value.trim();
            const title = document.getElementById('alumniTitle').value.trim();
            const pass = document.getElementById('alumniPass').value;
            const passConfirm = document.getElementById('alumniPassConfirm').value;

            console.log('[Alumni Signup] Values:', { name, email, dept, year, company, title, passLength: pass.length });

            // Validation
            if (!name) throw new Error('Name is required');
            if (!email) throw new Error('Email is required');
            if (!dept) throw new Error('Department is required');
            if (!year) throw new Error('Graduation year is required');
            if (!company) throw new Error('Company is required');
            if (!title) throw new Error('Job title is required');
            if (!pass) throw new Error('Password is required');
            if (pass.length < 8) throw new Error('Password must be at least 8 characters');
            if (pass !== passConfirm) throw new Error('Passwords do not match');

            console.log('[Alumni Signup] Validation passed');

            // Call Supabase
            console.log('[Alumni Signup] Calling Supabase.auth.signUp...');
            const { data, error } = await window.supabaseClient.auth.signUp({
                email,
                password: pass,
                options: {
                    data: {
                        full_name: name,
                        role: 'alumni',
                        department: dept,
                        grad_year: year,
                        company: company,
                        job_role: title
                    }
                }
            });

            if (error) {
                console.error('[Alumni Signup] Supabase Error:', error);
                throw new Error(`Supabase error: ${error.message}`);
            }

            if (!data || !data.user) {
                console.error('[Alumni Signup] No user in response:', data);
                throw new Error('Account creation failed - no user returned');
            }

            console.log('[Alumni Signup] ✅ Success! User ID:', data.user.id);

            // Save and redirect
            localStorage.setItem('alumnix_user', JSON.stringify({
                id: data.user.id,
                email: email,
                name: name,
                role: 'alumni'
            }));

            showAlert('Account created successfully! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1500);
        }

        // Setup form when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupForm);
        } else {
            setupForm();
        }

        // Log config status
        console.log('[Signup] Config status:', {
            configExists: !!window.ALUMNIX_CONFIG,
            supabaseUrl: window.ALUMNIX_CONFIG?.SUPABASE_URL ? '✓' : '✗',
            anonKey: window.ALUMNIX_CONFIG?.SUPABASE_ANON_KEY ? '✓' : '✗',
            clientExists: !!window.supabaseClient,
            authExists: !!window.supabaseClient?.auth
        });
    </script>
</body>
</html>
