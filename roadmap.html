<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Career Roadmap — AlumniX</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="top-header-container"></div>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-wrapper">
      
      <!-- Page Header -->
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
        <div>
          <span class="pill pill-green" style="margin-bottom: 8px;">🗺️ AI Roadmap Generator</span>
          <h1 style="font-size: 2rem; margin-bottom: 4px;">My Career Roadmap</h1>
          <p class="text-sm text-muted">AI-generated step-by-step milestones to help you reach your target career goal.</p>
        </div>

        <button class="btn btn-secondary btn-sm" id="btn-regenerate-roadmap">
          🔄 Regenerate AI Roadmap
        </button>
      </div>

      <!-- Roadmap Overall Progress Header -->
      <div class="card" style="margin-bottom: 28px; background: linear-gradient(135deg, #FFFFFF 0%, #F5FAF6 100%); border: 1px solid var(--border-hover);">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
          <div>
            <span class="mono-tag">TARGET ROLE PATH</span>
            <h2 style="font-size: 1.35rem; margin-top: 2px;" id="roadmap-target-title">Software Engineer</h2>
          </div>
          <div style="text-align: right;">
            <span class="mono-tag">COMPLETION STATUS</span>
            <div style="font-size: 1.75rem; font-weight: 800; color: var(--primary-green);" id="roadmap-pct-text">0%</div>
          </div>
        </div>

        <div class="progress-bar-bg" style="height: 10px;">
          <div class="progress-bar-fill" id="roadmap-progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Steps Checklist List -->
      <div style="display: flex; flex-direction: column; gap: 16px;" id="roadmap-steps-container">
        <div class="card animate-pulse" style="padding: 24px;">Generating personalized roadmap steps...</div>
      </div>

    </div>
  </main>

  <div id="bottom-nav-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/role-shell.js"></script>
  <script src="js/pages/roadmap.js"></script>
</body>
</html>
