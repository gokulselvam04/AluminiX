<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — AlumniX</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="top-header-container"></div>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-wrapper">
      
      <div style="max-width: 680px; margin: 0 auto;">
        
        <div class="card" style="padding: 32px; margin-bottom: 24px; text-align: center;">
          <div class="user-avatar-initial" style="width: 72px; height: 72px; font-size: 1.8rem; margin: 0 auto 16px auto;" id="profile-avatar">
            AX
          </div>
          <h1 style="font-size: 1.75rem; margin-bottom: 4px;" id="profile-display-name">KIT User</h1>
          <p class="text-sm text-muted" id="profile-display-role" style="margin-bottom: 12px;">Student • CSE</p>
          <span class="pill pill-green" id="profile-badge-role">⚡ Active Member</span>
          
          <div data-role="student" style="margin-top: 20px; text-align: left;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <span class="text-sm font-semibold">Roadmap Progress</span>
              <span class="text-sm font-semibold" style="color: var(--primary-green);">65%</span>
            </div>
            <div style="width: 100%; height: 8px; background: var(--border-default); border-radius: 4px; overflow: hidden;">
              <div style="width: 65%; height: 100%; background: var(--primary-green);"></div>
            </div>
          </div>
        </div>

        <div class="card" style="padding: 32px;">
          <h3 style="font-size: 1.2rem; margin-bottom: 20px;">Account Details</h3>
          
          <form id="profile-edit-form">
            <div class="form-group">
              <label class="form-label" for="prof-email">Email Address</label>
              <input type="email" id="prof-email" class="form-control" readonly disabled style="opacity: 0.7;">
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-fullname">Full Name</label>
              <input type="text" id="prof-fullname" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-institution">Institution</label>
              <input type="text" id="prof-institution" class="form-control" value="Karpagam Institute of Technology" readonly disabled style="opacity: 0.7;">
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-department">Department</label>
              <select id="prof-department" class="form-control" required>
                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                <option value="Artificial Intelligence & Data Science">AI & Data Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics & Communication Engineering">Electronics & Communication</option>
                <option value="Electrical & Electronics Engineering">Electrical & Electronics</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-interest">Interest Area / Bio</label>
              <textarea id="prof-interest" class="form-control" rows="3" placeholder="Share your primary technical interests (e.g. AI & ML, SaaS, Cloud Infrastructure)..."></textarea>
            </div>

            <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
              <button type="submit" class="btn btn-primary" id="btn-save-profile">
                Save Changes ✓
              </button>
            </div>
          </form>
        </div>

      </div>

    </div>
  </main>

  <div id="bottom-nav-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/role-shell.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
