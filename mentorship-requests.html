<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentorship Requests — AlumniX</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="top-header-container"></div>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-wrapper">
      
      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 2rem; margin-bottom: 4px;" id="mentorship-page-title">Mentorship Requests</h1>
        <p class="text-sm text-muted" id="mentorship-page-subtitle">Manage your mentorship connections — sent and received.</p>
      </div>

      <!-- Tabs (injected by mentorship.js) -->
      <div id="mentorship-tabs" style="margin-bottom: 20px;"></div>

      <!-- Requests Container -->
      <div style="display: flex; flex-direction: column; gap: 16px;" id="requests-list-container">
        <div class="card animate-pulse" style="padding: 24px;">Loading requests...</div>
      </div>

    </div>
  </main>

  <div id="bottom-nav-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/role-shell.js"></script>
  <script src="js/pages/mentorship.js"></script>
</body>
</html>
